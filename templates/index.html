<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Fitness Recommendation System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f5f7fa,
                    #e4edf5
                );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }


        .container {
            width: 100%;
            max-width: 650px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.12);
        }


        .header {
            text-align: center;

            margin-bottom: 30px;
        }


        .header h1 {
            font-size: 32px;

            margin-bottom: 10px;
        }


        .header p {
            color: #666;

            font-size: 15px;

            line-height: 1.5;
        }


        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .form-group input,
        .form-group select {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            background: white;
        }


        .form-group input:focus,
        .form-group select:focus {

            border-color: #333;
        }


        .submit-button {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;
        }


        .submit-button:hover {
            background: #444;
        }


        .info {

            margin-top: 25px;

            padding: 15px;

            background: #f4f4f4;

            border-radius: 8px;

            font-size: 13px;

            color: #555;

            line-height: 1.5;

            text-align: center;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="header">

            <h1>
                AI Fitness Assistant
            </h1>

            <p>
                Enter your basic information to receive
                personalized calorie, diet, workout and
                goal-time recommendations.
            </p>

        </div>


        <!-- ==================================================
             FITNESS FORM
             ================================================== -->

        <form
            action="/predict"
            method="POST"
        >


            <!-- AGE -->

            <div class="form-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    min="18"
                    max="100"
                    required
                    placeholder="Enter your age"
                >

            </div>


            <!-- GENDER -->

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Select gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

            </div>


            <!-- HEIGHT -->

            <div class="form-group">

                <label for="height">
                    Height (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    name="height"
                    min="120"
                    max="230"
                    step="0.1"
                    required
                    placeholder="e.g. 175"
                >

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    name="weight"
                    min="30"
                    max="250"
                    step="0.1"
                    required
                    placeholder="e.g. 70"
                >

            </div>


            <!-- FITNESS GOAL -->

            <div class="form-group">

                <label for="goal">
                    Fitness Goal
                </label>

                <select
                    id="goal"
                    name="goal"
                    required
                >

                    <option
                        value=""
                        disabled
                        selected
                    >
                        Select your goal
                    </option>

                    <option value="Weight Loss">
                        Weight Loss
                    </option>

                    <option value="Weight Gain">
                        Weight Gain
                    </option>

                </select>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="submit-button"
            >
                Get My Fitness Plan
            </button>


        </form>


        <div class="info">

            BMI and BMR are calculated automatically
            from your information before the machine-learning
            models generate the recommendations.

        </div>

    </div>

</body>

</html>
